# SPDX-License-Identifier: MIT
name: Build FFmpeg tools

on:
  push:
    branches: [dev]
    paths:
      - third_party/ffmpeg/**
      - .github/workflows/build-ffmpeg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build from archived source
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "TARGET=$PLATFORM" \
            --output type=local,dest=output third_party/ffmpeg
          tar -czf "ruri-ffmpeg-$PLATFORM.tar.gz" -C output .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ruri-ffmpeg-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ffmpeg-${{ matrix.platform }}
      - name: Run the packaged tools
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir output
          tar -xzf "ruri-ffmpeg-$PLATFORM.tar.gz" -C output
          python third_party/ffmpeg/smoke.py "$PLATFORM" output

  source:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archive corresponding source
        run: |
          git archive --format=tar.gz --output=ruri-ffmpeg-9.0.2-rurimecha.1-sources.tar.gz \
            HEAD third_party/ffmpeg .github/workflows/build-ffmpeg.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ffmpeg-corresponding-source
          path: ruri-ffmpeg-9.0.2-rurimecha.1-sources.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
